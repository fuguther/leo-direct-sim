name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies (VM-aligned versions)
        run: pip install pytest simpy==4.0.1 numpy==1.24.3 pyyaml pillow==12.0.0
      - name: Check document governance
        run: python scripts/check_document_governance.py --mode all
      - name: Run test suite
        run: python -m pytest CODE/leo_sim/tests CODE/experiment_platform/tests CODE/tests -q
