name: document-governance-weekly

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit document authority and staleness
        run: >-
          python scripts/check_document_governance.py
          --mode all
          --report document-governance-report.json
      - name: Upload governance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: document-governance-report
          path: document-governance-report.json
          if-no-files-found: warn
